<title>징글벨 크리스마스 카드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Jua&display=swap">
<style>
/* Layout: one full-bleed animated night scene (canvas) with the greeting floating in the sky and a single music control at the bottom. Single dark look by choice. */
:root{
  --night:#070b24;
  --snow:#fbf7ee;
  --berry:#e8364a;
  --gold:#ffc94d;
  --pine:#3fbf7a;
  --ink-soft:rgba(251,247,238,.78);
  --glass:rgba(10,14,44,.55);
  --font-display:"Mountains of Christmas","Georgia",serif;
  --font-ko:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--snow);overflow:hidden;font-family:var(--font-ko);word-break:keep-all;-webkit-tap-highlight-color:transparent}
#scene{position:fixed;inset:0;display:block;touch-action:manipulation;cursor:pointer}
.greet{
  position:fixed;left:0;right:0;top:0;
  padding-top:calc(env(safe-area-inset-top,0px) + clamp(18px,5vh,56px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  text-align:center;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;gap:clamp(4px,1.2vh,12px);
  text-shadow:0 2px 18px rgba(7,11,36,.85);
}
.eyebrow{font-size:clamp(12px,1.6vw,15px);letter-spacing:.32em;color:var(--gold);text-transform:uppercase}
h1{
  margin:0;font-family:var(--font-display);font-weight:700;line-height:1;
  font-size:clamp(46px,9.5vw,124px);text-wrap:balance;
  transform:scale(calc(1 + var(--pulse,0) * .035));
}
h1 .word{display:inline-block;white-space:nowrap;margin:0 .14em}
h1 .ch{display:inline-block;animation:hop 1.6s ease-in-out infinite;animation-delay:calc(var(--i) * -0.11s)}
h1 .ch:nth-child(3n+1){color:var(--berry)}
h1 .ch:nth-child(3n+2){color:var(--snow)}
h1 .ch:nth-child(3n){color:var(--gold)}
body.playing h1 .ch{animation-duration:.714s}
@keyframes hop{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-.12em) rotate(3deg)}}
.ko{margin:0;font-size:clamp(22px,4.2vw,40px);color:var(--snow)}
.msg{margin:0;max-width:34em;font-size:clamp(14px,2vw,18px);line-height:1.6;color:var(--ink-soft);text-wrap:balance}
.dock{
  position:fixed;left:0;right:0;bottom:0;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;
}
#music{
  pointer-events:auto;display:inline-flex;align-items:center;gap:10px;
  font:inherit;font-size:18px;color:var(--night);background:var(--gold);
  border:0;border-radius:999px;padding:12px 22px 12px 16px;cursor:pointer;
  box-shadow:0 6px 24px rgba(255,201,77,.35),inset 0 -3px 0 rgba(0,0,0,.15);
  transition:transform .15s ease, background .2s ease;
}
#music:hover{transform:translateY(-2px)}
#music:active{transform:translateY(1px)}
#music:focus-visible{outline:3px solid var(--snow);outline-offset:3px}
#music.on{background:var(--berry);color:var(--snow);box-shadow:0 6px 24px rgba(232,54,74,.4),inset 0 -3px 0 rgba(0,0,0,.2)}
#music svg{width:24px;height:24px}
#music.on svg{animation:ring .36s ease-in-out infinite alternate}
@keyframes ring{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.hint{font-size:13px;color:var(--ink-soft);text-shadow:0 1px 8px rgba(7,11,36,.9)}
@media (prefers-reduced-motion:reduce){
  h1 .ch,#music.on svg{animation:none}
  h1{transform:none}
}
</style>

<canvas id="scene" aria-label="눈 내리는 밤, 반짝이는 트리와 눈사람, 하늘을 나는 썰매가 있는 크리스마스 풍경"></canvas>

<header class="greet">
  <div class="eyebrow">Christmas 2026</div>
  <h1 id="title" aria-label="Merry Christmas"></h1>
  <p class="ko">즐거운 성탄절 보내세요!</p>
  <p class="msg">한 해 동안 정말 고마웠어요. 따뜻하고 반짝이는 크리스마스, 그리고 행복 가득한 새해 맞이하세요.</p>
</header>

<div class="dock">
  <button id="music" type="button" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21a2 2 0 0 0 4 0"/><path d="M12 3v2"/></svg>
    <span id="musicLabel">징글벨 음악 켜기</span>
  </button>
  <div class="hint">화면 아무 곳이나 톡 눌러보세요</div>
</div>

<script>
(() => {
/* ---------- headline letters ---------- */
const title = document.getElementById('title');
let idx = 0;
'Merry Christmas'.split(' ').forEach(w => {
  const word = document.createElement('span'); word.className = 'word'; word.setAttribute('aria-hidden','true');
  for (const c of w) { const s = document.createElement('span'); s.className='ch'; s.style.setProperty('--i', idx++); s.textContent = c; word.appendChild(s); }
  title.appendChild(word);
});

/* ---------- audio: Jingle Bells (public domain), synthesized ---------- */
const BPM = 168, B = 60 / BPM, LOOP_BEATS = 64;
let ac = null, musicGain, sfxGain, noiseBuf, playing = false, loopStart = 0, nextLoop = 0, timer = null;
const mf = m => 440 * Math.pow(2, (m - 69) / 12);
const C4=60,D4=62,E4=64,F4=65,G4=67;
const phraseA = [[E4,1],[E4,1],[E4,2],[E4,1],[E4,1],[E4,2],[E4,1],[G4,1],[C4,1.5],[D4,.5],[E4,4]];
const melody = [
  ...phraseA,
  [F4,1],[F4,1],[F4,1.5],[F4,.5],[F4,1],[E4,1],[E4,1],[E4,.5],[E4,.5],[E4,1],[D4,1],[D4,1],[E4,1],[D4,2],[G4,2],
  ...phraseA,
  [F4,1],[F4,1],[F4,1],[F4,1],[F4,1],[E4,1],[E4,1],[E4,.5],[E4,.5],[G4,1],[G4,1],[F4,1],[D4,1],[C4,4]
];
const CH = { C:{r:48,t:[60,64,67]}, F:{r:53,t:[60,65,69]}, D:{r:50,t:[62,66,69]}, G:{r:43,t:[59,62,67]} };
const bars = ['C','C','C','C','F','C','D','G','C','C','C','C','F','C','G','C'];

function initAudio(){
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  const master = ac.createGain(); master.gain.value = .9;
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
  master.connect(comp).connect(ac.destination);
  musicGain = ac.createGain(); musicGain.gain.value = 0; musicGain.connect(master);
  sfxGain = ac.createGain(); sfxGain.gain.value = .7; sfxGain.connect(master);
  noiseBuf = ac.createBuffer(1, ac.sampleRate * .5, ac.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
}
function env(gn, t, peak, dec, end){
  gn.gain.setValueAtTime(0.0001, t);
  gn.gain.exponentialRampToValueAtTime(peak, t + .008);
  gn.gain.exponentialRampToValueAtTime(Math.max(peak*dec,0.0002), t + .12);
  gn.gain.exponentialRampToValueAtTime(0.0001, end);
}
function tone(type, f, t, dur, peak, dest, dec=.5, lp=0){
  const o = ac.createOscillator(), gn = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  let node = o;
  if (lp){ const fl = ac.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value = lp; o.connect(fl); node = fl; }
  node.connect(gn).connect(dest);
  env(gn, t, peak, dec, t + dur);
  o.start(t); o.stop(t + dur + .05);
}
function bell(f, t, peak, dest){
  tone('sine', f, t, 1.1, peak, dest, .35);
  tone('sine', f*2.76, t, .45, peak*.35, dest, .2);
  tone('sine', f*5.4, t, .2, peak*.12, dest, .1);
}
function noise(t, dur, peak, type, freq, q, dest){
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.value = freq; fl.Q.value = q;
  const gn = ac.createGain();
  s.connect(fl).connect(gn).connect(dest);
  gn.gain.setValueAtTime(peak, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.start(t); s.stop(t + dur + .02);
}
function kick(t){
  const o = ac.createOscillator(), gn = ac.createGain();
  o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(42, t + .14);
  gn.gain.setValueAtTime(.55, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + .28);
  o.connect(gn).connect(musicGain); o.start(t); o.stop(t + .3);
}
function scheduleLoop(t0){
  let beat = 0;
  for (const [m, len] of melody){
    const t = t0 + beat * B, dur = len * B * .92;
    tone('square', mf(m), t, dur, .07, musicGain, .55, 2600);
    tone('triangle', mf(m), t, dur, .09, musicGain, .7);
    bell(mf(m + 12), t, .05, musicGain);
    beat += len;
  }
  bars.forEach((c, bi) => {
    const ch = CH[c], tb = t0 + bi * 4 * B;
    for (let k=0;k<4;k++){
      const t = tb + k * B;
      tone('triangle', mf(k % 2 ? ch.r + 7 : ch.r), t, B * .8, .28, musicGain, .6);
      if (k % 2) ch.t.forEach(n => tone('square', mf(n), t, B * .35, .022, musicGain, .4, 1800));
      if (k % 2 === 0) kick(t); else noise(t, .12, .14, 'bandpass', 1900, .8, musicGain);
      noise(t, .07, .07, 'highpass', 7000, .7, musicGain);
      noise(t + B/2, .05, .045, 'highpass', 8000, .7, musicGain);
    }
  });
}
function startMusic(){
  initAudio(); if (ac.state === 'suspended') ac.resume();
  if (!timer){
    loopStart = ac.currentTime + .12; scheduleLoop(loopStart); nextLoop = loopStart + LOOP_BEATS * B;
    timer = setInterval(() => { if (ac.currentTime > nextLoop - 2){ scheduleLoop(nextLoop); nextLoop += LOOP_BEATS * B; } }, 250);
  }
  musicGain.gain.cancelScheduledValues(ac.currentTime);
  musicGain.gain.setTargetAtTime(1, ac.currentTime, .05);
  playing = true;
}
function stopMusic(){
  if (!ac) return;
  musicGain.gain.cancelScheduledValues(ac.currentTime);
  musicGain.gain.setTargetAtTime(0, ac.currentTime, .08);
  playing = false;
}
function chime(){
  initAudio(); if (ac.state === 'suspended') ac.resume();
  const t = ac.currentTime + .01, base = [84, 88, 91, 96];
  base.forEach((m, i) => bell(mf(m), t + i * .06, .09, sfxGain));
}
const btn = document.getElementById('music'), lbl = document.getElementById('musicLabel');
btn.addEventListener('click', e => {
  e.stopPropagation();
  if (playing){ stopMusic(); btn.classList.remove('on'); btn.setAttribute('aria-pressed','false'); lbl.textContent='징글벨 음악 켜기'; document.body.classList.remove('playing'); }
  else { startMusic(); btn.classList.add('on'); btn.setAttribute('aria-pressed','true'); lbl.textContent='음악 끄기'; document.body.classList.add('playing'); }
});
document.addEventListener('visibilitychange', () => {
  if (!ac) return;
  if (document.hidden) ac.suspend(); else ac.resume();
});

/* ---------- scene ---------- */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOTION = reduce ? .35 : 1;
const cv = document.getElementById('scene'), g = cv.getContext('2d');
let W, H, dpr, u, stars = [], houses = [], flakes = [], parts = [], smoke = [], shooters = [];
const R = (a,b) => a + Math.random()*(b-a);
const TAU = Math.PI * 2;

const glowCache = {};
function glow(col){
  if (glowCache[col]) return glowCache[col];
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d'), gr = x.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0, col); gr.addColorStop(.25, col + 'aa'); gr.addColorStop(1, col + '00');
  x.fillStyle = gr; x.fillRect(0,0,64,64);
  return glowCache[col] = c;
}
const farHill = x => H*.70 + Math.sin(x/W*3 + .5)*H*.03 + Math.sin(x/W*7.3)*H*.012;
const ground  = x => H*.81 + Math.sin(x/W*2.2 + 1)*H*.018;

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr; cv.style.width = W+'px'; cv.style.height = H+'px';
  g.setTransform(dpr,0,0,dpr,0,0);
  u = Math.max(.5, Math.min(1.3, Math.min(W, H*1.2)/1000));
  stars = Array.from({length: Math.round(W*H/4200)}, () => ({x:R(0,W), y:R(0,H*.66), r:R(.4,1.7), p:R(0,TAU), s:R(.8,3)}));
  const n = Math.max(3, Math.round(W/230));
  houses = Array.from({length:n}, (_, i) => {
    const w = R(46,78)*u, x = (i+.5)*W/n + R(-.25,.25)*W/n;
    return {x, w, h:w*R(.62,.85), win:[R(0,TAU),R(0,TAU)], tint:['#7b3b4a','#4a5a8a','#6b4a3a','#3f6b5a'][i%4], puff:R(0,1)};
  }).filter(h => Math.abs(h.x - treeX()) > 90*u && Math.abs(h.x - snowX()) > 80*u);
  const fc = Math.min(340, Math.round(W*H/4800));
  flakes = Array.from({length:fc}, () => newFlake(true));
}
function newFlake(any){
  const r = Math.pow(Math.random(), 2.2)*3.6 + .7;
  return {x:R(-20,W+20), y: any ? R(-H*.1,H) : R(-40,-5), r, v: r*14 + R(8,22), p:R(0,TAU), a:R(.5,.95)};
}
const treeX = () => W*(W < 700 ? .3 : .33);
const snowX = () => W*(W < 700 ? .77 : .7);
const treeS = () => Math.min(H*.48, W*(W < 700 ? .72 : .5));

/* sky */
function drawSky(t){
  const gr = g.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,'#060a22'); gr.addColorStop(.5,'#16205a'); gr.addColorStop(.78,'#3a2f6e'); gr.addColorStop(1,'#4b3a72');
  g.fillStyle = gr; g.fillRect(0,0,W,H);
  for (const s of stars){
    const a = .35 + .65*(.5 + .5*Math.sin(t*s.s*MOTION + s.p));
    g.globalAlpha = a; g.fillStyle = '#fff8e6';
    g.beginPath(); g.arc(s.x, s.y, s.r, 0, TAU); g.fill();
  }
  g.globalAlpha = 1;
  // moon
  const mx = W*(W < 700 ? .86 : .84), my = H*(W < 700 ? .34 : .2), mr = Math.min(W,H)*.055;
  g.globalCompositeOperation = 'lighter';
  g.globalAlpha = .55; g.drawImage(glow('#ffe9a8'), mx-mr*5, my-mr*5, mr*10, mr*10);
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  g.fillStyle = '#fff6d8'; g.beginPath(); g.arc(mx,my,mr,0,TAU); g.fill();
  g.fillStyle = 'rgba(210,190,140,.35)';
  [[-.3,-.2,.22],[.35,.15,.16],[-.05,.45,.12]].forEach(([a,b,c]) => { g.beginPath(); g.arc(mx+a*mr,my+b*mr,c*mr,0,TAU); g.fill(); });
  // shooting stars
  if (Math.random() < .004*MOTION && shooters.length < 2) shooters.push({x:R(W*.1,W*.9), y:R(0,H*.25), vx:R(-700,-450), vy:R(180,280), life:1});
}
function drawShooters(dt){
  for (let i = shooters.length-1; i >= 0; i--){
    const s = shooters[i]; s.x += s.vx*dt; s.y += s.vy*dt; s.life -= dt*1.4;
    if (s.life <= 0){ shooters.splice(i,1); continue; }
    const gr = g.createLinearGradient(s.x, s.y, s.x - s.vx*.18, s.y - s.vy*.18);
    gr.addColorStop(0, `rgba(255,248,220,${s.life})`); gr.addColorStop(1,'rgba(255,248,220,0)');
    g.strokeStyle = gr; g.lineWidth = 2; g.beginPath(); g.moveTo(s.x,s.y); g.lineTo(s.x - s.vx*.18, s.y - s.vy*.18); g.stroke();
  }
}

/* sleigh */
function reindeer(x, y, t, ph){
  y += Math.sin(t*10 + ph)*3*u;
  g.strokeStyle = '#6e4529'; g.lineCap = 'round'; g.lineWidth = 3.2*u;
  [[12,0],[8,Math.PI],[-12,Math.PI*.5],[-8,Math.PI*1.5]].forEach(([lx,o]) => {
    const a = Math.sin(t*12 + ph + o)*.75;
    g.beginPath(); g.moveTo(x+lx*u, y+5*u); g.lineTo(x+lx*u + Math.sin(a)*13*u, y+5*u + Math.cos(a)*13*u); g.stroke();
  });
  g.fillStyle = '#8f5d3c';
  g.beginPath(); g.ellipse(x, y, 20*u, 9*u, 0, 0, TAU); g.fill();
  g.lineWidth = 7*u; g.strokeStyle = '#8f5d3c';
  g.beginPath(); g.moveTo(x+13*u, y-3*u); g.lineTo(x+22*u, y-13*u); g.stroke();
  g.beginPath(); g.ellipse(x+25*u, y-15*u, 7.5*u, 5.5*u, -.2, 0, TAU); g.fill();
  g.fillStyle = '#6e4529'; g.beginPath(); g.ellipse(x+31*u, y-13*u, 4*u, 3*u, 0, 0, TAU); g.fill();
  g.strokeStyle = '#e3c590'; g.lineWidth = 2*u;
  g.beginPath(); g.moveTo(x+22*u,y-19*u); g.lineTo(x+18*u,y-30*u); g.moveTo(x+19.5*u,y-25*u); g.lineTo(x+14*u,y-27*u);
  g.moveTo(x+26*u,y-20*u); g.lineTo(x+29*u,y-31*u); g.moveTo(x+28*u,y-26*u); g.lineTo(x+33*u,y-27*u); g.stroke();
  g.fillStyle = '#fbf7ee'; g.beginPath(); g.arc(x-20*u, y-3*u, 3*u, 0, TAU); g.fill();
  g.fillStyle = '#1b1020'; g.beginPath(); g.arc(x+26*u, y-17*u, 1.2*u, 0, TAU); g.fill();
  g.fillStyle = '#ffc94d'; g.beginPath(); g.arc(x+17*u, y-6*u, 2.6*u, 0, TAU); g.fill();
}
function drawSleigh(t, dt){
  const period = 17, fly = 11, p = ((t*MOTION) % period) / fly;
  if (p >= 1) return;
  const x = -320*u + p*(W + 640*u), y = H*(W < 700 ? .5 : .36) - Math.sin(p*Math.PI)*H*.14;
  const tilt = -Math.cos(p*Math.PI)*.14;
  g.save(); g.translate(x, y); g.rotate(tilt);
  // harness
  g.strokeStyle = 'rgba(255,201,77,.8)'; g.lineWidth = 1.4*u;
  g.beginPath(); g.moveTo(28*u,-8*u); g.quadraticCurveTo(90*u, 6*u, 192*u, -6*u); g.stroke();
  [80,136,192].forEach((rx, i) => reindeer(rx*u, -2*u, t, i*1.3));
  // sack + santa
  g.fillStyle = '#9a6a3f'; g.beginPath(); g.ellipse(-30*u,-28*u,13*u,15*u,-.3,0,TAU); g.fill();
  g.fillStyle = '#d42a3a'; g.beginPath(); g.arc(-6*u,-30*u,12*u,0,TAU); g.fill();
  const wave = Math.sin(t*7)*.5 - .9;
  g.strokeStyle = '#d42a3a'; g.lineWidth = 5*u; g.lineCap = 'round';
  g.beginPath(); g.moveTo(0,-34*u); g.lineTo(Math.cos(wave)*16*u, -34*u + Math.sin(wave)*16*u); g.stroke();
  g.fillStyle = '#fbf7ee'; g.beginPath(); g.arc(Math.cos(wave)*17*u, -34*u + Math.sin(wave)*17*u, 3*u, 0, TAU); g.fill();
  g.fillStyle = '#f2c9a0'; g.beginPath(); g.arc(-4*u,-47*u,7*u,0,TAU); g.fill();
  g.fillStyle = '#fbf7ee'; g.beginPath(); g.arc(-3*u,-41*u,6.5*u,0,Math.PI); g.fill();
  g.fillStyle = '#d42a3a'; g.beginPath(); g.moveTo(-12*u,-51*u); g.lineTo(4*u,-52*u); g.lineTo(-14*u,-64*u); g.closePath(); g.fill();
  g.fillStyle = '#fbf7ee'; g.beginPath(); g.arc(-14*u,-64*u,3*u,0,TAU); g.fill(); g.fillRect(-13*u,-53*u,18*u,3.5*u);
  // sleigh body
  g.fillStyle = '#c8202f';
  g.beginPath(); g.moveTo(-44*u,-24*u); g.lineTo(18*u,-22*u); g.quadraticCurveTo(34*u,-22*u,32*u,-6*u);
  g.lineTo(28*u,6*u); g.lineTo(-34*u,6*u); g.quadraticCurveTo(-50*u,-6*u,-44*u,-24*u); g.fill();
  g.strokeStyle = '#ffc94d'; g.lineWidth = 2.4*u; g.stroke();
  g.beginPath(); g.moveTo(-26*u,6*u); g.lineTo(-26*u,14*u); g.moveTo(16*u,6*u); g.lineTo(16*u,14*u);
  g.moveTo(-42*u,14*u); g.lineTo(30*u,14*u); g.quadraticCurveTo(44*u,14*u,40*u,4*u); g.stroke();
  g.restore();
  // sparkle trail
  if (Math.random() < .9) parts.push({x: x - 40*u, y: y + 10*u, vx:R(-30,10), vy:R(-10,30), life:1, decay:R(.6,1.1), size:R(6,14)*u, col:['#ffe08a','#ffffff','#ffc94d'][parts.length%3], kind:'spark'});
}

/* village */
function drawVillage(t, dt){
  g.fillStyle = '#c9d3f0';
  g.beginPath(); g.moveTo(0,H);
  for (let x = 0; x <= W; x += 8) g.lineTo(x, farHill(x));
  g.lineTo(W,H); g.closePath(); g.fill();
  for (const h of houses){
    const by = farHill(h.x) + h.h*.12, x0 = h.x - h.w/2;
    // chimney
    g.fillStyle = '#5a3a44'; g.fillRect(x0 + h.w*.68, by - h.h - h.w*.42, h.w*.12, h.w*.32);
    g.fillStyle = h.tint; g.fillRect(x0, by - h.h, h.w, h.h);
    g.fillStyle = '#2b2350';
    g.beginPath(); g.moveTo(x0 - h.w*.1, by - h.h + 1); g.lineTo(h.x, by - h.h - h.w*.48); g.lineTo(x0 + h.w*1.1, by - h.h + 1); g.closePath(); g.fill();
    g.fillStyle = '#f4f7ff';
    g.beginPath(); g.moveTo(x0 - h.w*.12, by - h.h + 2); g.lineTo(h.x, by - h.h - h.w*.5); g.lineTo(x0 + h.w*1.12, by - h.h + 2);
    g.lineTo(x0 + h.w*.95, by - h.h + 5); g.lineTo(h.x, by - h.h - h.w*.36); g.lineTo(x0 + h.w*.05, by - h.h + 5); g.closePath(); g.fill();
    h.win.forEach((ph, i) => {
      const a = .75 + .25*Math.sin(t*2.3*MOTION + ph);
      const wx = x0 + h.w*(i ? .62 : .16), wy = by - h.h*.72, ws = h.w*.22;
      g.globalCompositeOperation = 'lighter'; g.globalAlpha = .45*a;
      g.drawImage(glow('#ffb84a'), wx - ws, wy - ws, ws*3, ws*3);
      g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
      g.fillStyle = `rgba(255,${190 + 30*a|0},90,1)`; g.fillRect(wx, wy, ws, ws);
      g.fillStyle = h.tint; g.fillRect(wx + ws*.45, wy, ws*.1, ws); g.fillRect(wx, wy + ws*.45, ws, ws*.1);
    });
    h.puff += dt*1.6*MOTION;
    if (h.puff > 1){ h.puff = 0; smoke.push({x: x0 + h.w*.74, y: by - h.h - h.w*.45, r: 4*u, life:1}); }
  }
  for (let i = smoke.length-1; i >= 0; i--){
    const s = smoke[i]; s.life -= dt*.35; s.y -= dt*18*u; s.x += dt*(10 + Math.sin(s.life*6)*8)*u; s.r += dt*7*u;
    if (s.life <= 0){ smoke.splice(i,1); continue; }
    g.fillStyle = `rgba(220,226,250,${s.life*.35})`; g.beginPath(); g.arc(s.x, s.y, s.r, 0, TAU); g.fill();
  }
  // near ground
  const gr = g.createLinearGradient(0, H*.78, 0, H);
  gr.addColorStop(0,'#f4f7ff'); gr.addColorStop(1,'#b9c4ea');
  g.fillStyle = gr; g.beginPath(); g.moveTo(0,H);
  for (let x = 0; x <= W; x += 8) g.lineTo(x, ground(x));
  g.lineTo(W,H); g.closePath(); g.fill();
}

/* tree */
const LIGHT_COLS = ['#ff4d5e','#ffd34d','#5fb8ff','#5fe39a','#ff7ad1'];
function drawTree(t, mus){
  const x = treeX(), base = ground(x), s = treeS();
  g.save(); g.translate(x, base); g.rotate(Math.sin(t*1.1)*.012*MOTION);
  g.fillStyle = '#5a3620'; g.fillRect(-s*.045, -s*.13, s*.09, s*.14);
  const tiers = [];
  for (let i = 0; i < 4; i++){
    const bw = s*.37*(1 - i*.2), by = -s*.1 - i*s*.19, ty = by - s*.31;
    tiers.push({bw, by, ty});
    const gr = g.createLinearGradient(-bw, 0, bw, 0);
    gr.addColorStop(0,'#0c3a24'); gr.addColorStop(.45,'#1f7a47'); gr.addColorStop(1,'#0e4529');
    g.fillStyle = gr; g.beginPath(); g.moveTo(0, ty);
    g.quadraticCurveTo(bw*.3, ty + (by-ty)*.55, bw, by);
    const sc = 5 - Math.min(i,2);
    for (let k = 0; k < sc; k++){ const step = 2*bw/sc; g.quadraticCurveTo(bw - (k+.5)*step, by + s*.035, bw - (k+1)*step, by); }
    g.quadraticCurveTo(-bw*.3, ty + (by-ty)*.55, 0, ty); g.fill();
    // snow dusting
    g.fillStyle = 'rgba(244,247,255,.85)';
    for (let k = 0; k < sc; k++){ const step = 2*bw/sc, cx = bw - (k+.5)*step; g.beginPath(); g.ellipse(cx, by + s*.006, step*.28, s*.008, 0, 0, TAU); g.fill(); }
  }
  // garlands + lights
  let li = 0;
  const bi = mus ? Math.floor(mus.e) : 0, pulse = mus ? mus.pulse : 0;
  tiers.forEach((tr, i) => {
    const gy = tr.by - s*.085, w = tr.bw * (gy - tr.ty)/(tr.by - tr.ty) * .92;
    const n = 9 - i*1.5 | 0, pts = [];
    for (let k = 0; k <= n; k++){ const v = -1 + 2*k/n; pts.push([v*w, gy + (1 - v*v)*s*.045 - v*s*.025]); }
    g.strokeStyle = 'rgba(255,214,110,.75)'; g.lineWidth = Math.max(1, s*.006);
    g.beginPath(); pts.forEach(([px,py], k) => k ? g.lineTo(px,py) : g.moveTo(px,py)); g.stroke();
    pts.forEach(([px,py]) => {
      const col = LIGHT_COLS[li % 5];
      const b = mus ? (((li + bi) % 3 === 0) ? 1 : .35) + pulse*.25 : .35 + .65*(.5 + .5*Math.sin(t*3.2*MOTION + li*1.7));
      g.globalCompositeOperation = 'lighter'; g.globalAlpha = Math.min(1, b)*.85;
      const gs = s*.07*(.7 + b*.5); g.drawImage(glow(col), px - gs/2, py - gs/2, gs, gs);
      g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
      g.fillStyle = col; g.beginPath(); g.arc(px, py, s*.011, 0, TAU); g.fill();
      li++;
    });
    // ornaments
    const oc = ['#e8364a','#ffc94d','#d9e2ff'];
    [-.55,.1,.6].slice(0, i < 3 ? 3 : 1).forEach((v, k) => {
      const oy = tr.by - s*.02, ox = v*tr.bw*.8;
      g.fillStyle = oc[(k+i)%3]; g.beginPath(); g.arc(ox, oy, s*.02, 0, TAU); g.fill();
      g.fillStyle = 'rgba(255,255,255,.7)'; g.beginPath(); g.arc(ox - s*.007, oy - s*.007, s*.006, 0, TAU); g.fill();
    });
  });
  // star
  const sy = tiers[3].ty - s*.005, sr = s*.06*(1 + pulse*.18), rot = Math.sin(t*1.3)*.25*MOTION;
  g.globalCompositeOperation = 'lighter'; g.globalAlpha = .7 + .3*Math.sin(t*3);
  g.drawImage(glow('#ffd34d'), -sr*4, sy - sr*4, sr*8, sr*8);
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  g.save(); g.translate(0, sy); g.rotate(rot);
  g.fillStyle = '#ffd34d'; g.beginPath();
  for (let k = 0; k < 10; k++){ const r = k % 2 ? sr*.45 : sr, a = -Math.PI/2 + k*Math.PI/5; g.lineTo(Math.cos(a)*r, Math.sin(a)*r); }
  g.closePath(); g.fill(); g.strokeStyle = '#fff2b0'; g.lineWidth = s*.004; g.stroke();
  g.restore();
  // rays
  g.strokeStyle = 'rgba(255,230,150,.35)'; g.lineWidth = s*.004;
  for (let k = 0; k < 8; k++){ const a = t*.6*MOTION + k*Math.PI/4, r1 = sr*1.3, r2 = sr*(2 + .4*Math.sin(t*4 + k)); g.beginPath(); g.moveTo(Math.cos(a)*r1, sy + Math.sin(a)*r1); g.lineTo(Math.cos(a)*r2, sy + Math.sin(a)*r2); g.stroke(); }
  g.restore();
  // gifts
  const gifts = [[-.32,.13,.11,'#e8364a','#ffd34d'],[.22,.1,.12,'#3b7be8','#fbf7ee'],[.4,.08,.08,'#ffd34d','#e8364a'],[-.16,.08,.07,'#3fbf7a','#ffd34d']];
  gifts.forEach(([ox, bw, bh, c1, c2], i) => {
    const gx = x + ox*s, gb = ground(gx);
    const hop = mus ? ((bi % 4 === i) ? mus.pulse : 0)*s*.05 : Math.abs(Math.sin(t*2*MOTION + i))*s*.008;
    const w = bw*s, h = bh*s, y0 = gb - h - hop + s*.01;
    g.fillStyle = c1; g.fillRect(gx - w/2, y0, w, h);
    g.fillStyle = 'rgba(0,0,0,.12)'; g.fillRect(gx + w*.2, y0, w*.3, h);
    g.fillStyle = c2; g.fillRect(gx - w*.06, y0, w*.12, h); g.fillRect(gx - w/2, y0 + h*.18, w, h*.12);
    g.fillRect(gx - w*.55, y0 - h*.02, w*1.1, h*.16);
    g.strokeStyle = c2; g.lineWidth = Math.max(1.5, s*.008);
    g.beginPath(); g.ellipse(gx - w*.14, y0 - h*.1, w*.14, h*.1, -.5, 0, TAU); g.ellipse(gx + w*.14, y0 - h*.1, w*.14, h*.1, .5, 0, TAU); g.stroke();
  });
}

/* snowman */
function drawSnowman(t, mus){
  const x = snowX(), base = ground(x), r = treeS()*.11;
  const hop = mus ? mus.pulse*r*.18 : 0;
  g.save(); g.translate(x, base - hop);
  g.fillStyle = 'rgba(80,90,150,.18)'; g.beginPath(); g.ellipse(0, hop + 2, r*1.2, r*.18, 0, 0, TAU); g.fill();
  const ball = (cy, rr) => {
    const gr = g.createRadialGradient(-rr*.35, cy - rr*.35, rr*.1, 0, cy, rr);
    gr.addColorStop(0,'#ffffff'); gr.addColorStop(1,'#c3cdf0');
    g.fillStyle = gr; g.beginPath(); g.arc(0, cy, rr, 0, TAU); g.fill();
  };
  ball(-r, r); ball(-r*2.5, r*.74);
  // arms
  g.strokeStyle = '#6a4326'; g.lineWidth = r*.07; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-r*.65, -r*2.55); g.lineTo(-r*1.5, -r*2.95); g.lineTo(-r*1.7, -r*3.15); g.moveTo(-r*1.5, -r*2.95); g.lineTo(-r*1.62, -r*2.75); g.stroke();
  const a = -.8 + Math.sin(t*5*MOTION)*.45;
  const ax = r*.65, ay = -r*2.55, ex = ax + Math.cos(a)*r*.95, ey = ay + Math.sin(a)*r*.95;
  g.beginPath(); g.moveTo(ax, ay); g.lineTo(ex, ey); g.lineTo(ex + r*.18, ey - r*.22); g.moveTo(ex, ey); g.lineTo(ex + r*.25, ey + r*.02); g.stroke();
  ball(-r*3.65, r*.52);
  // scarf
  const flap = Math.sin(t*4*MOTION);
  g.fillStyle = '#e8364a';
  g.beginPath(); g.ellipse(0, -r*3.17, r*.55, r*.13, 0, 0, TAU); g.fill();
  g.beginPath(); g.moveTo(r*.15, -r*3.15); g.quadraticCurveTo(r*(.5 + flap*.15), -r*2.8, r*(.35 + flap*.2), -r*2.4); g.lineTo(r*(.12 + flap*.2), -r*2.45); g.quadraticCurveTo(r*.2, -r*2.8, -r*.05, -r*3.1); g.fill();
  g.fillStyle = '#ffd34d'; g.fillRect(-r*.4, -r*3.2, r*.08, r*.1); g.fillRect(-r*.1, -r*3.2, r*.08, r*.1); g.fillRect(r*.2, -r*3.2, r*.08, r*.1);
  // face
  const blink = (t % 4.2) < .13;
  g.fillStyle = '#1d1630';
  if (blink){ g.fillRect(-r*.24, -r*3.78, r*.14, r*.035); g.fillRect(r*.1, -r*3.78, r*.14, r*.035); }
  else { g.beginPath(); g.arc(-r*.17, -r*3.77, r*.06, 0, TAU); g.arc(r*.17, -r*3.77, r*.06, 0, TAU); g.fill(); }
  g.fillStyle = '#ff8a2b'; g.beginPath(); g.moveTo(0, -r*3.68); g.lineTo(r*.42, -r*3.6); g.lineTo(0, -r*3.56); g.closePath(); g.fill();
  g.fillStyle = '#1d1630';
  for (let k = 0; k < 5; k++){ const aa = Math.PI*.2 + k*Math.PI*.15; g.beginPath(); g.arc(Math.cos(aa)*r*.28, -r*3.6 + Math.sin(aa)*r*.2, r*.03, 0, TAU); g.fill(); }
  [-2.25, -2.0, -1.0, -.7].forEach(by => { g.beginPath(); g.arc(0, by*r, r*.055, 0, TAU); g.fill(); });
  // cheeks
  g.fillStyle = 'rgba(255,120,140,.35)'; g.beginPath(); g.arc(-r*.3, -r*3.6, r*.07, 0, TAU); g.arc(r*.32, -r*3.6, r*.07, 0, TAU); g.fill();
  // hat
  g.save(); g.translate(0, -r*4.05); g.rotate(-.12 + Math.sin(t*2.5*MOTION)*.05);
  g.fillStyle = '#1d1630'; g.fillRect(-r*.55, -r*.05, r*1.1, r*.12); g.fillRect(-r*.34, -r*.65, r*.68, r*.62);
  g.fillStyle = '#e8364a'; g.fillRect(-r*.34, -r*.2, r*.68, r*.12);
  g.fillStyle = '#3fbf7a'; g.beginPath(); g.ellipse(r*.18, -r*.16, r*.1, r*.05, .5, 0, TAU); g.fill();
  g.fillStyle = '#e8364a'; g.beginPath(); g.arc(r*.25, -r*.2, r*.05, 0, TAU); g.fill();
  g.restore();
  g.restore();
}

/* snow + particles */
function drawFlakes(t, dt, front){
  const wind = Math.sin(t*.25)*22;
  g.fillStyle = '#ffffff';
  for (let i = 0; i < flakes.length; i++){
    const f = flakes[i];
    if ((f.r > 2.6) !== front) continue;
    f.y += f.v*dt*MOTION; f.x += (wind*(f.r/3) + Math.sin(t*1.3 + f.p)*12)*dt*MOTION;
    if (f.y > H + 10 || f.x < -30 || f.x > W + 30){ flakes[i] = newFlake(false); continue; }
    g.globalAlpha = f.a; g.beginPath(); g.arc(f.x, f.y, f.r, 0, TAU); g.fill();
  }
  g.globalAlpha = 1;
}
function burst(x, y, n, big){
  const cols = ['#ff4d5e','#ffd34d','#5fb8ff','#5fe39a','#ff7ad1','#ffffff'];
  for (let i = 0; i < n; i++){
    const a = R(0,TAU), sp = R(80, big ? 420 : 260);
    const kind = Math.random() < .55 ? 'spark' : 'confetti';
    parts.push({x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - (big ? 60 : 30), life:1, decay:R(.45,.9), size:R(6,16)*u, col:cols[i%cols.length], kind, rot:R(0,TAU), vr:R(-8,8)});
  }
}
function drawParts(dt){
  for (let i = parts.length-1; i >= 0; i--){
    const p = parts[i];
    p.life -= dt*p.decay; if (p.life <= 0){ parts.splice(i,1); continue; }
    p.vy += (p.kind === 'confetti' ? 220 : 140)*dt; p.vx *= .985; p.vy *= .985;
    p.x += p.vx*dt; p.y += p.vy*dt;
    if (p.kind === 'spark'){
      g.globalCompositeOperation = 'lighter'; g.globalAlpha = p.life;
      const s = p.size*(.6 + p.life*.6); g.drawImage(glow(p.col), p.x - s/2, p.y - s/2, s, s);
      g.globalCompositeOperation = 'source-over';
    } else {
      p.rot += p.vr*dt; g.globalAlpha = Math.min(1, p.life*1.5);
      g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.scale(1, Math.cos(p.rot*1.7));
      g.fillStyle = p.col; g.fillRect(-p.size*.3, -p.size*.15, p.size*.6, p.size*.3); g.restore();
    }
  }
  g.globalAlpha = 1;
  if (parts.length > 900) parts.splice(0, parts.length - 900);
}

cv.addEventListener('pointerdown', e => { burst(e.clientX, e.clientY, 70, true); chime(); });

/* loop */
let last = performance.now(), lastBar = -1;
function frame(now){
  const dt = Math.min(.05, (now - last)/1000); last = now;
  const t = now/1000;
  let mus = null;
  if (playing && ac){
    const e = (ac.currentTime - loopStart)/B;
    if (e >= 0){
      mus = {e, pulse: reduce ? 0 : Math.exp(-(e % 1)*5)};
      const bar = Math.floor(e/4);
      if (bar !== lastBar){ lastBar = bar; if (bar % 2 === 0 && !reduce) burst(R(W*.15, W*.85), R(H*.12, H*.42), 45, false); }
    }
  }
  title.style.setProperty('--pulse', mus ? mus.pulse : 0);
  drawSky(t); drawShooters(dt);
  drawSleigh(t, dt);
  drawFlakes(t, dt, false);
  drawVillage(t, dt);
  drawTree(t, mus);
  drawSnowman(t, mus);
  drawParts(dt);
  drawFlakes(t, dt, true);
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
})();
</script>
